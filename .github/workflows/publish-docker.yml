name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to compile while warming release caches (does not publish)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI for this commit
        # Manual builds can warm the default branch's caches alongside CI.
        # Only tag pushes publish images, and they must pass this gate.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          successful_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="${GITHUB_SHA}" \
              -f status=success \
              -f per_page=1 \
              --jq '.total_count'
          )"

          if [[ "${successful_runs}" -lt 1 ]]; then
            echo "::error::Commit ${GITHUB_SHA} has no successful CI run. Wait for CI to pass before creating the tag."
            exit 1
          fi

  build_frontend:
    name: Build frontend
    needs: verify_ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            aether-vscodex/web/package-lock.json

      - name: Install dependencies and build
        working-directory: frontend
        env:
          AETHER_BUILD_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build_gateway:
    name: Build gateway (${{ matrix.arch }})
    needs: verify_ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      CROSS_CONFIG: .github/cross-release.toml
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_CLIENT_SIDE: '1'
      SCCACHE_IDLE_TIMEOUT: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Set compiler cache directory
        run: echo "SCCACHE_DIR=${RUNNER_TEMP}/sccache" >> "${GITHUB_ENV}"

      - name: Set up Rust compiler cache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.17.0

      # Bulk archives avoid sccache's per-object GHA API writes being dropped
      # under rate limiting during two simultaneous cold release builds.
      - name: Restore compiler cache archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: release-sccache-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            release-sccache-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Connect cross to the compiler cache
        shell: bash
        run: |
          set -euo pipefail
          # The client compiles inside cross and talks to the host daemon.
          # Disk cache hits return paths, so mount the cache at the same path.
          mkdir -p "${SCCACHE_DIR}"
          printf 'CROSS_CONTAINER_OPTS=--network=host --volume=%s:/usr/local/bin/sccache:ro --volume=%s:%s\n' \
            "${SCCACHE_PATH}" "${SCCACHE_DIR}" "${SCCACHE_DIR}" >> "${GITHUB_ENV}"
          sccache --start-server

      - name: Keep only the active Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          while read -r toolchain _; do
            if [[ "${toolchain}" != "${active_toolchain}" ]]; then
              rustup toolchain uninstall "${toolchain}"
            fi
          done < <(rustup toolchain list)

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-${{ matrix.target }}
          key: ${{ hashFiles('.github/cross-release.toml') }}
          workspaces: . -> target
          cache-on-failure: false
          cache-workspace-crates: true

      - name: Install cross
        uses: taiki-e/install-action@896fc2f9f9fdb3d9747dbce378ccab57f25346f4 # cross
        with:
          tool: cross@0.2.5

      - name: Build gateway
        env:
          AETHER_BUILD_VERSION: ${{ inputs.version || github.ref_name }}
          AETHER_BUILD_TYPE: release
        run: python3 .github/scripts/measure.py cross build --release --locked -p aether-gateway --bin aether-gateway --target ${{ matrix.target }} --timings

      - name: Upload release build timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-build-timings-${{ matrix.arch }}
          path: target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload gateway artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: aether-gateway-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Build and publish Docker image
    if: github.event_name == 'push'
    needs:
      - build_frontend
      - build_gateway
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Prepare Docker build context
        run: |
          mkdir -p dist/frontend
          install -m 0755 artifacts/aether-gateway-amd64/aether-gateway dist/aether-gateway-amd64
          install -m 0755 artifacts/aether-gateway-arm64/aether-gateway dist/aether-gateway-arm64
          cp -R artifacts/frontend-dist/. dist/frontend/

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest GHCR image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # Keep signed provenance in GitHub without a sha256-* referrers tag
          # in GHCR. BuildKit provenance remains part of the image index.
          push-to-registry: false
          create-storage-record: false

      - name: Remove legacy GHCR attestation tags
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: python3 .github/scripts/cleanup_registry_attestations.py
